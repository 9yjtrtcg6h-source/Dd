<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>License Admin</title>
<style>body{font:16px system-ui;max-width:760px;margin:36px auto;padding:0 16px;background:#f5f6f8;color:#171717}main{background:white;padding:22px;border-radius:14px}input,button{font:inherit;padding:10px;margin:5px;border:1px solid #bbb;border-radius:8px}button{background:#171717;color:white}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eee;padding:12px;border-radius:8px}</style>
<main><h1>Activation Key Admin</h1><p>Admin token (keep private; never put it in the iOS app).</p><input id="token" type="password" placeholder="Admin token"><p>Validity in days <input id="days" type="number" min="1" max="3650" value="30"><button id="create">Generate key</button><button id="refresh">Refresh</button></p><h2>New key</h2><pre id="newkey">None yet</pre><h2>Existing keys</h2><pre id="list">Not loaded</pre><p id="status"></p></main>
<script>
const $=x=>document.getElementById(x);
async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{"Content-Type":"application/json","Authorization":"Bearer "+$("token").value}});const d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");return d}
async function load(){try{const a=await api("/api/admin/keys");$("list").textContent=a.map(x=>x.id+" | "+x.duration_days+" days | "+(x.revoked?"REVOKED":x.activated_at?(Date.now()>=x.expires_at?"EXPIRED":"ACTIVE"):"UNUSED")).join("\n")||"No keys"}catch(e){$("status").textContent=e.message}}
$("create").onclick=async()=>{try{const d=await api("/api/admin/keys",{method:"POST",body:JSON.stringify({durationDays:Number($("days").value)})});$("newkey").textContent=d.key+"\\nCopy this now; plaintext is not stored.";await load()}catch(e){$("status").textContent=e.message}};
$("refresh").onclick=load;
</script></main>
